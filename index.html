<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOKIN Smart Room</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#e5673e" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#fdf6f4', 
                100: '#fbece8', 
                200: '#f6d5cc',
                300: '#efb3a2',
                400: '#e5673e', 
                500: '#e5673e', // Primary Brand Color
                600: '#d14d25', // Hover state
                700: '#b54e2e',
                800: '#8c301a',
                900: '#722a19',
              }
            },
            fontFamily: {
              sans: ['FC Pride', 'Arial', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      @font-face {
        font-family: 'FC Pride';
        src: url('/fonts/fc-pride-non-commercial.otf') format('opentype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      body {
        font-family: 'FC Pride', Arial, sans-serif;
      }
      /* Custom scrollbar for cleaner UI */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      @keyframes itRgbGlow {
        0%   { box-shadow: 0 0 8px 2px #00f5ff, 0 0 22px 5px #00f5ff88, 0 0 50px 10px #00f5ff33; outline-color: #00f5ff; }
        14%  { box-shadow: 0 0 8px 2px #0055ff, 0 0 22px 5px #0055ff88, 0 0 50px 10px #0055ff33; outline-color: #0055ff; }
        28%  { box-shadow: 0 0 8px 2px #aa00ff, 0 0 22px 5px #aa00ff88, 0 0 50px 10px #aa00ff33; outline-color: #aa00ff; }
        42%  { box-shadow: 0 0 8px 2px #ff00cc, 0 0 22px 5px #ff00cc88, 0 0 50px 10px #ff00cc33; outline-color: #ff00cc; }
        57%  { box-shadow: 0 0 8px 2px #ff3300, 0 0 22px 5px #ff330088, 0 0 50px 10px #ff330033; outline-color: #ff3300; }
        71%  { box-shadow: 0 0 8px 2px #ffcc00, 0 0 22px 5px #ffcc0088, 0 0 50px 10px #ffcc0033; outline-color: #ffcc00; }
        85%  { box-shadow: 0 0 8px 2px #00ff44, 0 0 22px 5px #00ff4488, 0 0 50px 10px #00ff4433; outline-color: #00ff44; }
        100% { box-shadow: 0 0 8px 2px #00f5ff, 0 0 22px 5px #00f5ff88, 0 0 50px 10px #00f5ff33; outline-color: #00f5ff; }
      }

      @keyframes itRgbBorder {
        0%   { border-color: #00f5ff; }
        14%  { border-color: #0055ff; }
        28%  { border-color: #aa00ff; }
        42%  { border-color: #ff00cc; }
        57%  { border-color: #ff3300; }
        71%  { border-color: #ffcc00; }
        85%  { border-color: #00ff44; }
        100% { border-color: #00f5ff; }
      }
      .booking-it-neon {
        position: relative;
        isolation: isolate;
        overflow: visible !important;
        background: linear-gradient(135deg, #000d1a 0%, #050010 50%, #0a0018 100%) !important;
        border: 2px solid #00f5ff !important;
        outline: 1.5px solid #00f5ff;
        outline-offset: 1px;
        color: #e0ffff !important;
        text-shadow: 0 0 6px #00f5ff, 0 0 12px rgba(0,200,255,0.8);
        animation:
          itRgbGlow   1.6s linear infinite,
          itRgbBorder 1.6s linear infinite;
      }
      .booking-it-neon::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 3px,
          rgba(0,245,255,0.05) 3px,
          rgba(0,245,255,0.05) 4px
        );
      }
      .booking-it-neon * {
        color: inherit !important;
        text-shadow: inherit !important;
      }
      .booking-it-neon > * {
        position: relative;
        z-index: 1;
      }
      @keyframes goldGlow {
        0%, 100% {
          box-shadow: 0 0 8px 1px rgba(245, 158, 11, 0.55), 0 0 16px 3px rgba(251, 191, 36, 0.35);
          border-color: #f59e0b !important;
        }
        50% {
          box-shadow: 0 0 15px 3px rgba(245, 158, 11, 0.85), 0 0 28px 6px rgba(251, 191, 36, 0.55);
          border-color: #fbbf24 !important;
        }
      }
      @keyframes goldBorderShine {
        0% { border-color: #d97706 !important; }
        33% { border-color: #fbbf24 !important; }
        66% { border-color: #fef08a !important; }
        100% { border-color: #d97706 !important; }
      }
      .booking-frame-king-gold {
        position: relative;
        border: 2px solid #f59e0b !important;
        animation: goldGlow 2.2s ease-in-out infinite, goldBorderShine 3s linear infinite;
      }
      .booking-frame-king-gold::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        border-radius: inherit;
        background: radial-gradient(circle at 50% 0%, rgba(254, 240, 138, 0.18), transparent 70%);
      }

      @keyframes silverGlow {
        0%, 100% {
          box-shadow: 0 0 7px 1px rgba(148, 163, 184, 0.5), 0 0 14px 2px rgba(203, 213, 225, 0.3);
          border-color: #94a3b8 !important;
        }
        50% {
          box-shadow: 0 0 13px 2px rgba(148, 163, 184, 0.75), 0 0 22px 4px rgba(203, 213, 225, 0.5);
          border-color: #cbd5e1 !important;
        }
      }
      .booking-frame-master-silver {
        position: relative;
        border: 2px solid #94a3b8 !important;
        animation: silverGlow 2.5s ease-in-out infinite;
      }
      .booking-frame-master-silver::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        border-radius: inherit;
        background: radial-gradient(circle at 50% 0%, rgba(241, 245, 249, 0.18), transparent 70%);
      }

      @keyframes bronzeGlow {
        0%, 100% {
          box-shadow: 0 0 7px 1px rgba(217, 119, 6, 0.45), 0 0 14px 2px rgba(234, 88, 12, 0.3);
          border-color: #b45309 !important;
        }
        50% {
          box-shadow: 0 0 13px 2px rgba(217, 119, 6, 0.7), 0 0 22px 4px rgba(234, 88, 12, 0.45);
          border-color: #d97706 !important;
        }
      }
      .booking-frame-champion-bronze {
        position: relative;
        border: 2px solid #d97706 !important;
        animation: bronzeGlow 2.8s ease-in-out infinite;
      }
      .booking-frame-champion-bronze::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        border-radius: inherit;
        background: radial-gradient(circle at 50% 0%, rgba(254, 215, 170, 0.18), transparent 70%);
      }

      .booking-frame-top4-teal {
        position: relative;
        border: 2px solid #14b8a6 !important;
        box-shadow: 0 0 8px 1px rgba(20, 184, 166, 0.45);
      }
      .booking-frame-top5-indigo {
        position: relative;
        border: 2px solid #6366f1 !important;
        box-shadow: 0 0 8px 1px rgba(99, 102, 241, 0.45);
      }

      /* 3D Kawaii Cute Dancing & Active Running Cats (Rank 1: Orange 3D, Rank 2: Grey 3D, Rank 3: Caramel 3D) */
      @keyframes catChibiDance3D {
        0%, 100% { transform: perspective(220px) rotateY(0deg) translateY(0) rotate(0deg) scale(1); }
        20% { transform: perspective(220px) rotateY(-16deg) translateY(-4px) rotate(-10deg) scale(1.1); }
        40% { transform: perspective(220px) rotateY(16deg) translateY(1px) rotate(10deg) scale(0.95); }
        60% { transform: perspective(220px) rotateY(-12deg) translateY(-5px) rotate(-8deg) scale(1.12); }
        80% { transform: perspective(220px) rotateY(14deg) translateY(0) rotate(8deg) scale(0.98); }
      }
      @keyframes catFastRunFeet {
        0%, 100% { transform: translateY(0) scale(1, 0.94); }
        25% { transform: translateY(-5px) rotate(9deg) scale(1.08, 1.06); }
        50% { transform: translateY(0) scale(1, 0.94); }
        75% { transform: translateY(-5px) rotate(-9deg) scale(1.08, 1.06); }
      }
      @keyframes catTailWhip3D {
        0%, 100% { transform: rotate(-35deg) scaleX(1); }
        50% { transform: rotate(45deg) scaleX(0.8); }
      }
      @keyframes catPawsJoy3D {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-4px) rotate(-18deg) scale(1.15); }
        75% { transform: translateY(-4px) rotate(18deg) scale(1.15); }
      }
      @keyframes crownGlowGold {
        0%, 100% { transform: translateY(0) rotate(-4deg) scale(1); filter: drop-shadow(0 2px 4px #f59e0b) brightness(1.1); }
        50% { transform: translateY(-5px) rotate(6deg) scale(1.18); filter: drop-shadow(0 4px 10px #fde047) brightness(1.35); }
      }
      @keyframes runSmokePuff3D {
        0% { opacity: 1; transform: scale(0.4) translateY(0); }
        100% { opacity: 0; transform: scale(1.8) translateY(-16px); }
      }
      @keyframes popEmotionBubble {
        0% { opacity: 0; transform: scale(0.2) translateY(6px); }
        50% { opacity: 1; transform: scale(1.25) translateY(-3px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }

      @keyframes penguinWaddle3D {
        0%, 100% { transform: perspective(200px) rotate(-14deg) translateY(0) scale(1); }
        50% { transform: perspective(200px) rotate(14deg) translateY(-4px) scale(1.05); }
      }
      @keyframes penguinFlippersJoy {
        0%, 100% { transform: rotate(-25deg); }
        50% { transform: rotate(35deg); }
      }
      @keyframes bunnyBouncyHop {
        0%, 100% { transform: translateY(0) scale(1, 0.95); }
        40% { transform: translateY(-7px) scale(0.96, 1.08); }
        70% { transform: translateY(-1px) scale(1.04, 0.96); }
      }
      @keyframes earTwitch3D {
        0%, 90%, 100% { transform: rotate(0deg); }
        93% { transform: rotate(-15deg); }
        96% { transform: rotate(15deg); }
      }
      @keyframes catSleepingBreathe {
        0%, 100% { transform: translateY(2px) scale(1, 0.94) rotate(2deg); }
        50% { transform: translateY(0px) scale(1.02, 1.02) rotate(0deg); }
      }
      @keyframes zzzFloat3D {
        0% { opacity: 0; transform: translate(0, 2px) scale(0.6); }
        30% { opacity: 1; transform: translate(3px, -5px) scale(1); }
        70% { opacity: 0.9; transform: translate(6px, -13px) scale(1.15); }
        100% { opacity: 0; transform: translate(9px, -20px) scale(0.7); }
      }

      .chibi-cat-3d-orange {
        animation: catChibiDance3D 0.85s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        transform-origin: bottom center;
        filter: drop-shadow(0 3px 8px rgba(249, 115, 22, 0.55)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.15));
      }
      .chibi-penguin-3d {
        animation: penguinWaddle3D 0.65s ease-in-out infinite;
        transform-origin: bottom center;
        filter: drop-shadow(0 3px 7px rgba(15, 23, 42, 0.5)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.12));
      }
      .chibi-bunny-3d {
        animation: bunnyBouncyHop 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
        transform-origin: bottom center;
        filter: drop-shadow(0 3px 7px rgba(244, 114, 182, 0.45)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.12));
      }
      .chibi-flipper-left {
        animation: penguinFlippersJoy 0.4s ease-in-out infinite alternate;
        transform-origin: top right;
      }
      .chibi-flipper-right {
        animation: penguinFlippersJoy 0.4s ease-in-out infinite alternate-reverse;
        transform-origin: top left;
      }
      .chibi-bunny-ear {
        animation: earTwitch3D 2.5s ease-in-out infinite;
        transform-origin: bottom center;
      }
      .chibi-running-active {
        animation: catFastRunFeet 0.3s ease-in-out infinite !important;
        transform-origin: bottom center;
      }
      .chibi-sleeping-mode {
        animation: catSleepingBreathe 2.4s ease-in-out infinite !important;
        transform-origin: bottom center;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18));
      }
      .zzz-floating-3d {
        animation: zzzFloat3D 2.2s ease-in-out infinite;
      }
      .chibi-tail-3d {
        animation: catTailWhip3D 0.5s ease-in-out infinite;
        transform-origin: bottom left;
      }
      .chibi-paws-3d {
        animation: catPawsJoy3D 0.38s ease-in-out infinite;
        transform-origin: center;
      }
      .chibi-crown-3d {
        animation: crownGlowGold 1.1s ease-in-out infinite;
        transform-origin: center bottom;
      }
      .smoke-puff-3d {
        animation: runSmokePuff3D 0.55s ease-out forwards;
      }
      .bubble-pop-3d {
        animation: popEmotionBubble 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      @keyframes petCompanionFloat {
        0%, 100% { transform: translateY(0) rotate(-8deg) scale(0.9); opacity: 0.78; }
        50% { transform: translateY(-8px) rotate(10deg) scale(1.15); opacity: 1; }
      }
      @keyframes petCompanionOrbit {
        0%, 100% { transform: translate(0, 0) rotate(8deg) scale(1); opacity: 0.75; }
        50% { transform: translate(5px, -6px) rotate(-12deg) scale(1.18); opacity: 1; }
      }
      .pet-companion-one {
        animation: petCompanionFloat 1.9s ease-in-out infinite;
        filter: drop-shadow(0 2px 3px rgba(15, 23, 42, 0.2));
      }
      .pet-companion-two {
        animation: petCompanionOrbit 2.35s ease-in-out infinite;
        filter: drop-shadow(0 2px 3px rgba(15, 23, 42, 0.2));
      }

      @media (prefers-reduced-motion: reduce) {
        .booking-it-neon,
        .booking-it-neon::after,
        .booking-it-neon::before,
        .booking-frame-king-gold,
        .booking-frame-master-silver,
        .booking-frame-champion-bronze,
        .chibi-cat-3d-orange,
        .chibi-cat-3d-grey,
        .chibi-cat-3d-caramel,
        .chibi-running-active,
        .chibi-sleeping-mode,
        .chibi-tail-3d,
        .chibi-paws-3d,
        .chibi-crown-3d,
        .pet-companion-one,
        .pet-companion-two {
          animation: none !important;
        }
      }
      .timeline-grid-scroll {
        overscroll-behavior-x: contain;
        scroll-behavior: auto;
        scrollbar-gutter: stable;
        -webkit-overflow-scrolling: touch;
        container-type: inline-size;
        contain: layout paint;
      }
      .timeline-grid-table {
        table-layout: fixed;
      }
      .timeline-grid-slot {
        width: clamp(96px, calc((100cqw - 8rem) / var(--timeline-hours, 12)), 142px);
        min-width: clamp(96px, calc((100cqw - 8rem) / var(--timeline-hours, 12)), 142px);
      }
      @supports not (width: 1cqw) {
        .timeline-grid-slot {
          width: clamp(96px, calc((100vw - 13.75rem) / var(--timeline-hours, 12)), 142px);
          min-width: clamp(96px, calc((100vw - 13.75rem) / var(--timeline-hours, 12)), 142px);
        }
      }
      @media (max-width: 640px) {
        .timeline-grid-slot {
          width: 112px;
          min-width: 112px;
        }
      }
      .timeline-grid-sticky {
        transform: translateZ(0);
        backface-visibility: hidden;
        contain: paint;
      }
      .timeline-grid-cell {
        contain: layout paint;
      }
      .timeline-grid-line {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        word-break: break-word;
      }
      .timeline-grid-purpose {
        display: block;
        max-width: 100%;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
      }
      .timeline-grid-purpose-track {
        display: block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) {
        .booking-it-neon,
        .booking-it-neon::after {
          display: block;
          max-width: 100%;
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
