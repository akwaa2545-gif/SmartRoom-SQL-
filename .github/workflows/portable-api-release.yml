name: Attested Portable API release

on:
  push:
    tags:
      - 'portable-api-v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a protected-main commit
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portable-api/package-lock.json

      - name: Install dependencies
        working-directory: portable-api
        run: npm ci

      - name: Run Portable API tests
        working-directory: portable-api
        run: npm test

      - name: Bind the archive to this release
        run: >-
          printf '{"tag":"%s","commit":"%s"}\n' "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          > portable-api/release-manifest.json

      - name: Create release archive
        run: >-
          zip -r portable-api-release.zip portable-api
          -x 'portable-api/.env' 'portable-api/.deploy-agent'
          'portable-api/secrets/*' 'portable-api/node_modules/*'

      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: portable-api-release.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" portable-api-release.zip
          --title "Portable API ${GITHUB_REF_NAME}"
          --generate-notes
