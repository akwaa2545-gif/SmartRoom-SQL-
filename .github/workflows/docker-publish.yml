name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
      - feature/booking-email-verification
    tags:
      - 'v*.*.*'
    paths:
      - 'portable-api/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web UI

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase automatically (e.g. akwaa2545-gif/smartroom-sql-/smartroom-api)
  IMAGE_NAME: ${{ github.repository }}/smartroom-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./portable-api
          file: ./portable-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
